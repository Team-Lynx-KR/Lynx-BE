name: Deploy Dev Branch

on:
  push:
    branches: [ dev ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and Push Backend Image
      uses: docker/build-push-action@v4
      with:
        context: .
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/lynx-backend:dev
        platforms: linux/amd64

    - name: Copy Docker Compose and Nginx config to EC2
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ubuntu
        key: ${{ secrets.EC2_SSH_KEY }}
        source: "docker-compose.prod.yml,nginx/"
        target: "/home/ubuntu/"

    - name: Deploy to EC2
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ubuntu
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          cd /home/ubuntu
          
          # 1. 기존 .env 안전하게 재생성
          rm -f .env
          echo "${{ secrets.PROD_ENV_FILE }}" > .env
          echo "DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}" >> .env
          
          # 2. 파일명 변경
          mv /home/ubuntu/docker-compose.prod.yml /home/ubuntu/docker-compose.yml
          
          # 3. 최신 이미지 받기
          sudo docker pull ${{ secrets.DOCKER_USERNAME }}/lynx-backend:dev
          
          # 4. 서비스 시작
          sudo docker compose up -d --force-recreate
          
          # 5. SSL 인증서 확인 및 HTTPS 설정 자동 활성화
          # 인증서가 이미 있으면 자동으로 nginx.conf 사용 (HTTPS 활성화)
          if sudo docker compose exec -T lynx-nginx test -f /etc/letsencrypt/live/lostparty.com/fullchain.pem 2>/dev/null; then
            echo "✅ SSL 인증서 발견 - HTTPS 설정 자동 적용"
            sudo sed -i 's/nginx.conf.init/nginx.conf/g' docker-compose.yml
            sudo docker compose restart lynx-nginx || true
            
            # 인증서 갱신 확인 (90일마다 필요)
            echo "🔄 인증서 갱신 확인 중..."
            sudo docker compose run --rm certbot renew --quiet || true
            sudo docker compose restart lynx-nginx || true
          else
            echo "ℹ️  SSL 인증서 없음 - HTTP만 사용 (nginx.conf.init)"
            echo "   인증서 발급은 수동으로 진행하세요: docker compose run --rm certbot certonly ..."
          fi
          
          # 6. 안 쓰는 이미지 청소
          sudo docker image prune -f